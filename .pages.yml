media:
  input: "static/img"
  output: "/img"

content:
  - name: "profile"
    label: "Perfil"
    type: "file"
    path: "content/_index.md"
    format: "yaml-frontmatter"
    fields:
      - name: "title"
        label: "Nome do negócio"
        type: "string"
        required: true
      - name: "bio"
        label: "Biografia / descrição curta"
        type: "text"
      - name: "foto_perfil"
        label: "Foto de perfil"
        type: "image"
      - name: "instagram_url"
        label: "URL do Instagram"
        description: "Opcional"
        type: "string"
      - name: "whatsapp_url"
        label: "URL do WhatsApp"
        description: "Ex: https://wa.me/55SEUNUMERO"
        type: "string"
      - name: "google_avaliacao_url"
        label: "Link para avaliar no Google"
        description: "Opcional"
        type: "string"
      - name: "video_youtube_url"
        label: "Link do vídeo no YouTube"
        description: "Opcional"
        type: "string"
      - name: "video_titulo"
        label: "Título/legenda do vídeo"
        description: "Opcional"
        type: "string"
      - name: "tema_cor"
        label: "Tema de cor do site"
        type: "select"
        default: "marrom"
        options:
          values:
            - value: "marrom"
              label: "Marrom/Bege (padrão)"
            - value: "verde"
              label: "Verde"
            - value: "rosa"
              label: "Rosa"
            - value: "azul"
              label: "Azul"
      - name: "fundo_ativo"
        label: "Usar imagem de fundo no site"
        description: "Liga ou desliga a foto de fundo escolhida abaixo"
        type: "boolean"
        default: false
      - name: "fundo_foto"
        label: "Foto de fundo"
        description: "Só aparece se a opção acima estiver ligada"
        type: "image"
      - name: "fundo_opacidade"
        label: "Opacidade da camada sobre a imagem de fundo"
        description: "De 0 (foto bem viva, quase sem filtro) a 100 (foto quase escondida). Sugestão: entre 30 e 55."
        type: "number"
        default: 40
      - name: "cardapio_ativo"
        label: "Mostrar tabela de preços?"
        description: "Lista de itens com preço, organizada por categoria (tipo cardápio de restaurante ou tabela de preços de salão/clínica)"
        type: "boolean"
        default: false
      - name: "cardapio_titulo"
        label: "Título da tabela de preços"
        type: "string"
      - name: "cardapio_subtitulo"
        label: "Subtítulo da tabela de preços"
        description: "Opcional"
        type: "string"

  - name: "links"
    label: "Links"
    type: "collection"
    path: "content/links"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, link_url, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "slug"
        label: "Identificador (slug)"
        type: "string"
        required: true
      - name: "title"
        label: "Título do link"
        type: "string"
        required: true
      - name: "link_url"
        label: "URL de destino"
        type: "string"
        required: true
      - name: "icone"
        label: "Ícone"
        description: "Classe Font Awesome, opcional. Ex: fa-solid fa-location-dot"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "cardapio"
    label: "Tabela de Preços"
    type: "collection"
    path: "content/cardapio"
    format: "yaml-frontmatter"
    view:
      primary: "title"
      fields: [title, categoria, preco, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "title"
        label: "Nome do item/serviço"
        type: "string"
        required: true
      - name: "preco"
        label: "Preço"
        description: "Em reais, ex: 50.00"
        type: "number"
        required: true
      - name: "categoria"
        label: "Categoria"
        description: "Texto livre para agrupar os itens"
        type: "string"
        required: true
      - name: "descricao"
        label: "Observação"
        description: "Opcional"
        type: "string"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true

  - name: "galeria"
    label: "Galeria de Fotos"
    type: "collection"
    path: "content/galeria"
    format: "yaml-frontmatter"
    view:
      primary: "legenda"
      fields: [legenda, peso]
      default:
        sort: "peso"
        order: "asc"
    fields:
      - name: "foto"
        label: "Foto"
        type: "image"
        required: true
      - name: "legenda"
        label: "Legenda"
        description: "Opcional"
        type: "text"
      - name: "peso"
        label: "Ordem de exibição"
        type: "number"
      - name: "_build"
        label: false
        hidden: true
        type: "object"
        default:
          render: "never"
          list: "local"
        fields:
          - name: "render"
            label: false
            type: "string"
            default: "never"
            hidden: true
          - name: "list"
            label: false
            type: "string"
            default: "local"
            hidden: true
